# GitLab CI/CD — задача 2: Git → сервер
# Задача 1 (Mac → Git): scripts/push-to-gitlab.sh, docs/CI-CD.md
# Variables: SSH_PRIVATE_KEY, DEPLOY_HOST, DEPLOY_USER

stages:
  - test
  - build
  - deploy

default:
  image: node:22-bookworm

variables:
  NPM_CONFIG_CACHE: $CI_PROJECT_DIR/.npm
  DEPLOY_HOST: "45.12.74.25"
  DEPLOY_USER: "deploy"

# Один кэш на все ветки, пока не меняется package-lock: меньше копий node_modules на диске раннера.
cache:
  key:
    files:
      - frontend/package-lock.json
  paths:
    - frontend/node_modules/
    - .npm/
  policy: pull

# --- Тесты (vitest, чистые функции). Красный тест = нет сборки и деплоя ---

test:
  stage: test
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules/
      - .npm/
    policy: pull-push
  before_script:
    - cd frontend
    - npm ci --prefer-offline --no-audit --no-fund
  script:
    - npm test

# --- Сборка (автоматически на push) ---

.build:
  stage: build
  needs:
    - job: test
      artifacts: false
  variables:
    # Nitro-сборка (минификация/бандлинг сервера) на shared-раннере падает в OOM (SIGKILL,
    # "Killed" без кода ошибки) уже после успешных "Client built"/"Server built" — куча
    # V8 разрастается без границ. Явный потолок заставляет V8 чаще собирать мусор
    # вместо попытки выделить больше памяти, чем есть у раннера.
    NODE_OPTIONS: "--max-old-space-size=3072"
  before_script:
    - cd frontend
    - npm ci --prefer-offline --no-audit --no-fund
  script:
    - npm run build
    # Шаблон заявления не в server/assets (Nitro OOM) — кладём рядом с сервером вручную.
    - mkdir -p .output/server/templates
    - cp -f server/templates/vacation-application.docx .output/server/templates/
    # Не грузим ~100MB картинок БЗ в GitLab artifacts (иначе 413 Request Entity Too Large).
    - rm -rf .output/public/knowledge
    - find .output -name '*.map' -delete || true
  artifacts:
    # knowledge уже вырезан в script; exclude — страховка. Деплой подмешивает из checkout.
    paths:
      - frontend/.output/
    exclude:
      - frontend/.output/public/knowledge/**/*
      - frontend/.output/**/*.map
    expire_in: 3 days

build:staging:
  extends: .build
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
  variables:
    NUXT_PUBLIC_APP_ENV: staging
    NUXT_PUBLIC_LAUNCH_SCOPE: full
    NUXT_PUBLIC_ORG_LINKS_ENABLED: "true"

build:production:
  extends: .build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  variables:
    NUXT_PUBLIC_APP_ENV: production
    NUXT_PUBLIC_LAUNCH_SCOPE: vacations
    NUXT_PUBLIC_ORG_LINKS_ENABLED: "true"

# --- Деплой на VPS (только из CI, не с локальной машины в обычном потоке) ---

.deploy:
  stage: deploy
  image: alpine:3.21
  before_script:
    - apk add --no-cache openssh-client rsync bash openssl
    - . deploy/scripts/setup-ci-ssh-key.sh
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

.deploy:staging:
  extends: .deploy
  needs:
    - job: build:staging
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
  script:
    - bash deploy/scripts/deploy-from-ci.sh staging

deploy:staging:
  extends: .deploy:staging
  when: on_success

.deploy:production:
  extends: .deploy
  needs:
    - job: build:production
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - bash deploy/scripts/deploy-from-ci.sh production

deploy:production:
  extends: .deploy:production
  when: manual

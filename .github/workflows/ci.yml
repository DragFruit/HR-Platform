name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve app env
        id: env
        shell: bash
        run: |
          if [ "${{ github.ref }}" = "refs/heads/staging" ] || [ "${{ github.base_ref }}" = "staging" ]; then
            echo "app_env=staging" >> "$GITHUB_OUTPUT"
          else
            echo "app_env=production" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NUXT_PUBLIC_APP_ENV: ${{ steps.env.outputs.app_env }}
          NUXT_PUBLIC_LAUNCH_SCOPE: full

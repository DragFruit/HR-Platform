name: Build artifact

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: Окружение сборки
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve app env
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "app_env=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "app_env=production" >> "$GITHUB_OUTPUT"
          else
            echo "app_env=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build Nuxt
        run: npm run build
        env:
          NUXT_PUBLIC_APP_ENV: ${{ steps.env.outputs.app_env }}
          NUXT_PUBLIC_LAUNCH_SCOPE: full

      - name: Upload .output
        uses: actions/upload-artifact@v4
        with:
          name: vbi-hr-${{ steps.env.outputs.app_env }}-${{ github.sha }}
          path: frontend/.output/
          retention-days: 14
